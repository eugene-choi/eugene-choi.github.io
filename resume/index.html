<style>
/* ============================================================
   Tokens — keep in sync with index.html
   ============================================================ */
:root{
  --paper:      #fbfbf8;
  --ink:        #1b1b19;
  --ink-soft:   #55554d;
  --ink-mute:   #8b8b80;
  --rule:       #e4e3db;
  --rule-soft:  #efeee8;
  --accent:     #2c5f5a;
  --accent-lift:#3f827a;

  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans:  "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:  "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --shell: 54rem;
  --rail:  9rem;
  --gap:   2.5rem;
}

/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:5rem; }

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:1.0625rem;
  line-height:1.65;
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  display:flex; flex-direction:column; min-height:100vh;
}

img{ max-width:100%; display:block; }

a{ color:inherit; }

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
  border-radius:1px;
}

.skip{
  position:absolute; left:-9999px;
  background:var(--ink); color:var(--paper);
  padding:.6rem 1rem; font-family:var(--sans); font-size:.875rem; z-index:100;
}
.skip:focus{ left:1rem; top:1rem; }

.shell{
  max-width:var(--shell);
  margin-inline:auto;
  padding-inline:1.75rem;
  width:100%;
}

/* ============================================================
   Top bar
   ============================================================ */
.topbar{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid transparent;
  transition:border-color .25s ease;
}
.topbar.is-stuck{ border-bottom-color:var(--rule); }

.topbar .shell{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:1.5rem; padding-block:1.15rem;
}

.wordmark{
  font-family:var(--serif);
  font-size:1.0625rem; font-weight:500;
  text-decoration:none; letter-spacing:-.005em;
  white-space:nowrap;
}
.wordmark .han{
  font-size:.8125rem; color:var(--ink-mute);
  margin-left:.5rem; font-weight:400;
}

.navlinks{
  display:flex; gap:1.5rem; margin:0; padding:0; list-style:none;
  font-family:var(--sans); font-size:.8125rem; font-weight:500;
  letter-spacing:.005em;
}
.navlinks a{
  text-decoration:none; color:var(--ink-soft);
  padding-bottom:.15rem;
  border-bottom:1px solid transparent;
  transition:color .18s ease, border-color .18s ease;
}
.navlinks a:hover{ color:var(--ink); border-bottom-color:var(--accent); }
.navlinks a[aria-current="page"]{ color:var(--ink); border-bottom-color:var(--accent); }

/* ============================================================
   Page
   ============================================================ */
main{ flex:1 0 auto; }

.page{ padding-block:4rem 3rem; }

.section-head{
  display:flex; align-items:baseline; gap:1rem;
  margin:0 0 1.75rem;
}
.section-head h1{
  margin:0;
  font-family:var(--serif);
  font-size:1.5rem; font-weight:500; letter-spacing:-.01em;
  white-space:nowrap;
}
.section-head::after{
  content:""; flex:1 1 auto; height:1px;
  background:var(--rule); transform:translateY(-.3rem);
}

.page-lede{
  margin:0 0 1.75rem;
  max-width:38rem;
  font-size:1.125rem; line-height:1.6;
  color:var(--ink-soft);
}

/* Actions */
.actions{
  display:flex; flex-wrap:wrap; align-items:center; gap:1.25rem;
  margin:0 0 2.25rem; padding:0; list-style:none;
  font-family:var(--sans); font-size:.875rem; font-weight:500;
}

.chip{
  display:inline-flex; align-items:center; gap:.5rem;
  padding:.5rem .95rem;
  border:1px solid var(--rule);
  border-radius:3px;
  color:var(--ink);
  text-decoration:none;
  background:transparent;
  transition:border-color .18s ease, background-color .18s ease, color .18s ease;
}
.chip:hover{
  border-color:var(--accent-lift);
  background:color-mix(in srgb, var(--accent) 6%, transparent);
  color:var(--accent);
}
.chip .glyph{ font-family:var(--mono); font-size:.8125rem; color:var(--ink-mute); }
.chip:hover .glyph{ color:var(--accent); }

.plainlink{
  color:var(--ink-soft); text-decoration:none;
  border-bottom:1px solid var(--rule);
  padding-bottom:.1rem;
  transition:color .18s ease, border-color .18s ease;
}
.plainlink:hover{ color:var(--accent); border-bottom-color:var(--accent-lift); }

/* Document frame */
.doc{
  border:1px solid var(--rule);
  border-radius:3px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 1px 2px rgba(27,27,25,.04);
}
.doc iframe{
  display:block;
  width:100%;
  height:min(88vh, 1040px);
  min-height:30rem;
  border:0;
}

.doc-caption{
  margin:.85rem 0 0;
  padding-left:.9rem;
  border-left:1px solid var(--accent-lift);
  font-family:var(--mono);
  font-size:.78125rem; line-height:1.7;
  color:var(--ink-soft);
  letter-spacing:-.01em;
}
.doc-caption a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--rule); }
.doc-caption a:hover{ border-bottom-color:var(--accent-lift); }

/* ============================================================
   Footer
   ============================================================ */
.foot{
  flex-shrink:0;
  margin-top:3.5rem;
  border-top:1px solid var(--rule);
  padding-block:2rem 3.5rem;
  font-family:var(--sans); font-size:.8125rem;
  color:var(--ink-mute);
}
.foot .shell{
  display:flex; flex-wrap:wrap; gap:.75rem 1.5rem; justify-content:space-between;
}
.foot a{ color:var(--ink-soft); border-bottom:1px solid var(--rule); text-decoration:none; }
.foot a:hover{ color:var(--accent); border-bottom-color:var(--accent-lift); }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:46rem){
  body{ font-size:1rem; }
  .shell{ padding-inline:1.25rem; }
  .topbar .shell{ padding-block:.9rem; }
  .wordmark .han{ display:none; }
  .navlinks{ gap:1.05rem; font-size:.78125rem; }

  .page{ padding-block:2.5rem 2rem; }
  .page-lede{ font-size:1.0625rem; }
  .actions{ gap:1rem; margin-bottom:1.75rem; }
  .doc iframe{ height:70vh; min-height:24rem; }
}

@media (max-width:24rem){
  .navlinks{ gap:.8rem; }
}

@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
